# Canonical request taxonomy — DRAFT v0.1 (for curation)
# Generated 2026-09-23 from 480 deduplicated notes (CE + Mobile + Pre-sales, W25–W39).
#
# draft_tally = rough count of notes seen for this request during the clustering read.
#   It is NOT the real count. The label pass (step 4) produces real counts after you curate.
# kind: defect | gap | confusion | pricing | integration | adoption

version: 0.1-draft

areas:
  - id: billing
    name: "Billing, Pricing & Seats"
  - id: onboarding
    name: "Onboarding & Implementation"
  - id: data
    name: "Data Import, Export & Migration"
  - id: integrations
    name: "Integrations & API"
  - id: scorecard
    name: "Scorecard"
  - id: execution
    name: "Rocks, To-Dos & Issues"
  - id: meetings
    name: "Meetings / L10"
  - id: reporting
    name: "Reporting & Visibility"
  - id: org
    name: "Org Structure, Roles & Permissions"
  - id: people
    name: "People / 1:1s & Reviews"
  - id: auth
    name: "Auth & Access"
  - id: mobile
    name: "Mobile"
  - id: ai
    name: "AI / Maz"
  - id: knowledge
    name: "Knowledge & Process"
  - id: partners
    name: "Partners & Coaches"
  - id: trust
    name: "Security, Compliance & Localization"
  - id: reliability
    name: "Platform Reliability & Data Integrity"

requests:

  - id: seat-model-confusion
    name: "Who needs a paid seat"
    area: billing
    kind: confusion
    definition: >-
      Uncertainty about which people require a paid license: observers, inactive or name-only chart users, to-do assignees, view-only meeting attendees, multi-team members.
    includes: "Questions and confusion about seat rules as they exist today."
    excludes: "Requests for NEW cheaper seat types (→ low-cost-contributor-seat)."
    draft_tally: 28
    status: active
    examples:
      - "Construction owner asks whether multi-team membership means paying per seat, and how to bulk-archive headlines; left 'a lot better.'"
      - "Returning power user on a five-person team confused by free-plan permissions and seats; sizing essentials vs accelerate, thrive too much."
      - "Campaign team wants a simple shared scorecard and clarity on who actually needs a paid account before adding people."

  - id: low-cost-contributor-seat
    name: "Cheaper seat for limited contributors"
    area: billing
    kind: pricing
    definition: >-
      Ask for a free or discounted seat type for people who contribute lightly (add issues, view, receive to-dos) rather than paying full price.
    includes: "Role-based pricing, volunteer/observer tiers, 'only key people paid'."
    excludes: "Pure confusion about current rules (→ seat-model-confusion)."
    draft_tally: 13
    status: active
    examples:
      - "Growing nonprofit wants shared Google Calendar sync for tasks and a free view-only tier for volunteers alongside paid staff seats."
      - "'Struggling to justify the full cost per seat' — wants role-based seat pricing so members cost less than managers."
      - "Can't afford seats for 24 non-leadership staff; asks whether they can post issues without a license."

  - id: mixed-tier-plans
    name: "Mix plan tiers in one company"
    area: billing
    kind: gap
    definition: >-
      Ability to put different users on different plan tiers (e.g., leadership on Thrive, others on Essentials) within one account.
    draft_tally: 4
    status: active
    examples:
      - "Wants plan tiers mixable within one company — leadership on Thrive, supervisors and admins on Accelerate or Essential."
      - "Wants ops on Thrive and everyone else on Accelerate but can't split tiers, so defaults to Essentials."
      - "Evaluating a Bloom Growth switch for 109 users; balks that AI/higher tier is a steep cost jump and plans can't be mixed."

  - id: feature-tier-gating
    name: "Features gated to higher tiers"
    area: billing
    kind: pricing
    definition: >-
      Friction because a needed capability requires a higher plan or a paid active seat: API on Thrive only, 1:1s on Accelerate, reviewers needing full seats, AI tier jump.
    excludes: "General price objections (→ price-objection)."
    draft_tally: 10
    status: active
    examples:
      - "On a grandfathered plan; wants one-on-one and annual review features but some seats can't access them — which plan?"
      - "MSP asks whether Ninety has an API to consolidate a client's seven-to-eight services into one dashboard; confirmed it needs Thrive tier."
      - "'Disappointed that the API is only available on the highest plan'—paying power user wants API access lower down."

  - id: price-objection
    name: "Price and ROI objections"
    area: billing
    kind: pricing
    definition: >-
      Cost is the barrier: too expensive, can't justify ROI, cost review, competitor cheaper, needs the 'why pay' case.
    excludes: "Discount-program mechanics (→ discount-programs)."
    draft_tally: 19
    status: active
    examples:
      - "Paying account uses Ninety only for meetings, calls it 'too expensive,' will move to MonsterOps ($99 unlimited) unless price matched."
      - "Evaluating Ninety for an insurance-agency rollout; wants the 'why 90 over other software' case and pause/proration billing clarity."
      - "VP of IT needs rough scalable/budgetary pricing to earmark Ninety in an October fiscal-year budget for cross-org project prioritization."

  - id: discount-programs
    name: "Nonprofit, annual and volume discounts"
    area: billing
    kind: pricing
    definition: >-
      Requests for or questions about discount programs: nonprofit, annual, bulk, loyalty.
    draft_tally: 9
    status: active
    examples:
      - "Nonprofit VP plans to start on Essentials with the nonprofit discount, navigating a CEO transition and cross-team communication gaps."
      - "Expanding usage to executive weekly reports; asks about a bulk discount and assigning managers for additional seats."
      - "Tech advisor wants to recommend Ninety to EOS-adopting franchise and nonprofit clients; asks about nonprofit pricing and implementer intros."

  - id: cancellation-refund-failures
    name: "Cancellation and refund failures"
    area: billing
    kind: defect
    definition: >-
      Cancelled but still charged/renewed, cannot find how to cancel, account still active after leaving.
    draft_tally: 5
    status: active
    examples:
      - "Cancelled last month but was charged again, had to cancel twice, now demands a refund of the latest charge."
      - "'I'd like to cancel all of our company subscriptions. There are 2. How do I cancel?'"
      - "'I cancelled prior to renewal but you still charged me and renewed me' — cancellation appears broken; demands cancel and refund."

  - id: billing-admin-flexibility
    name: "Billing administration flexibility"
    area: billing
    kind: gap
    definition: >-
      Self-serve billing mechanics: downgrade limits, PO/check payment, card update flow, consolidated billing, flexing seats, month-to-month, who can buy licenses, license-add errors.
    draft_tally: 13
    status: active
    examples:
      - "GM in turnaround loves Ninety but cash is tight; wants short-term, low-commitment licensing and clarity on costs."
      - "Asks to pay by purchase order and mailed check monthly instead of credit card—a college purchasing preference."
      - "Rebooting a business, needs three seats month-to-month; asks pricing and what's new beyond the basics."

  - id: trial-flexibility
    name: "Trial extension and continuity"
    area: billing
    kind: gap
    definition: >-
      Trial expired/consumed too early, needs extension, or fears built work disappears when the trial ends.
    draft_tally: 8
    status: active
    examples:
      - "Ready to subscribe but trial is expiring and he lacks owner rights; still wants Asana integrated with his scorecard."
      - "Self-implementer wants meeting-cadence best practices and worries built work vanishes when the trial ends."
      - "450-person company accidentally consumed its trial and asks for a fresh 30-day trial after their focus day."

  - id: setup-orientation
    name: "Where do I start / core concepts"
    area: onboarding
    kind: confusion
    definition: >-
      New users unsure how to set up or distinguish core objects: rocks vs to-dos vs issues vs headlines, scorecard vs measurables, what goes where.
    excludes: "Requests for paid help (→ implementation-services)."
    draft_tally: 28
    status: active
    examples:
      - "Onboarding user asks basic questions (what's an issue, a KPI, rocks) and weighs 90 for annual employee reviews."
      - "Coach-onboarded newcomer learning basics — where agenda topics go, scorecard for sales, Outlook invites."
      - "Leadership team confused explaining rocks vs metrics/scorecard to staff; wants eos best practices to clarify."

  - id: implementation-services
    name: "Affordable implementation help"
    area: onboarding
    kind: gap
    definition: >-
      Wants hands-on setup help, professional services, training sessions or an implementer at a price they can afford.
    draft_tally: 19
    status: active
    examples:
      - "Non-profit likes 90 after weeks of use; wants a tool walkthrough and the subscription moved to the finance owner."
      - "eos-certified admin re-adopting 90 wants formal eos training and breakout sessions for her team."
      - "Wants the framework implemented with clear monthly-per-seat and setup costs, hoping to delegate data entry."

  - id: training-content
    name: "Self-serve training and examples"
    area: onboarding
    kind: gap
    definition: >-
      Wants example videos (a real L10), tutorials, templates and best-practice guides to self-implement.
    draft_tally: 12
    status: active
    examples:
      - "Leadership team confused explaining rocks vs metrics/scorecard to staff; wants eos best practices to clarify."
      - "Self-implementer wants meeting-cadence best practices and worries built work vanishes when the trial ends."
      - "Fast-scaling startup wants a real L10 meeting example video and help running L10s on time."

  - id: adoption-risk
    name: "Fear the team won't adopt"
    area: onboarding
    kind: adoption
    definition: >-
      Concern about tool fatigue, complexity, or staff not using it: 'another layer', 'one more tool', non-desk staff.
    draft_tally: 19
    status: active
    examples:
      - "EOS council worried about 'app fatigue'; wants 90 to integrate with Teams/Loop and rated its clunky first meeting a six."
      - "CPA coach pushes them off Excel onto the platform, but they feel software fatigue and weigh how many licenses lanes need."
      - "CEO weighing adoption for succession planning but wary of adding 'one more tool' for a time-strapped team."

  - id: bulk-import
    name: "Bulk import from Excel/CSV"
    area: data
    kind: gap
    definition: >-
      Load existing scorecards, issues, rocks, users or org charts from spreadsheets instead of re-keying; preserve original dates.
    excludes: "Ongoing automatic sync (→ scorecard-data-sync)."
    draft_tally: 15
    status: active
    examples:
      - "Re-setting up 90 for weekly meetings and rocks; struggles with the directory upload template and seat counts."
      - "New customer mid-rollout wants to preload data and understand the AI 'thrive' tier and the starter consulting pack."
      - "Trial PT owner asks about Excel import, sharing rocks privately with a peer group, and tier pricing plus AI upgrade."

  - id: competitor-migration
    name: "Migrate from another EOS tool"
    area: data
    kind: gap
    definition: >-
      Move data and history off Bloom Growth, EOS One, Strety, Rhythm, Trello etc. without losing archives.
    draft_tally: 11
    status: active
    examples:
      - "New hire at kickoff wants to import archived Trello project history into Rocks/Issues, and asks about support access and cost tiers."
      - "Prospect on Bloom Growth wants the differentiation case, an L10 prep reminder, and help migrating data off Bloom Growth."
      - "Evaluating a switch from Bloom Growth but frets over data migration and reports the app 'locks up' and jumps between Issues."

  - id: export-portability
    name: "Export, print and data exit"
    area: data
    kind: gap
    definition: >-
      Clean export/print of meeting data, rocks with descriptions, review status; confidence data can leave.
    draft_tally: 6
    status: active
    examples:
      - "Wants clean data export for paper quarterlies after Strety's export 'was basically useless'; past adoption failed on team buy-in."
      - "Returning Bloom-switcher needs pricing and a proposal to present internally; confirmed scorecard export works."
      - "Wants to bulk-export People Analyzer review completion status and dates instead of checking each review individually."

  - id: calendar-sync
    name: "Calendar integration"
    area: integrations
    kind: integration
    definition: >-
      Meetings and to-dos in Google/Outlook calendars; correct invites and time zones.
    draft_tally: 12
    status: active
    examples:
      - "Growing nonprofit wants shared Google Calendar sync for tasks and a free view-only tier for volunteers alongside paid staff seats."
      - "Chief of staff finds L10 setup 'not readily obvious'; needs calendar-connection clarity and per-seat cost for a ~200-person rollout."
      - "Coach-onboarded newcomer learning basics — where agenda topics go, scorecard for sales, Outlook invites."

  - id: microsoft-ecosystem
    name: "Microsoft Teams / 365 / Planner"
    area: integrations
    kind: integration
    definition: >-
      Integration with Teams, Planner, SharePoint, Loop, Outlook.
    excludes: "SSO via Entra (→ sso-enforcement)."
    draft_tally: 12
    status: active
    examples:
      - "Sales org running EOS on shared docs wants 90 to streamline meetings and cascade across departments; uses Teams."
      - "EOS council worried about 'app fatigue'; wants 90 to integrate with Teams/Loop and rated its clunky first meeting a six."
      - "Wants leaders licensed across the CAM region; asks whether platform/support is in Spanish and about Teams/invoicing."

  - id: scorecard-data-sync
    name: "Auto-populate scorecard from other systems"
    area: integrations
    kind: integration
    definition: >-
      Scorecard numbers flow in from Excel/Sheets, CRM, ERP, POS or API instead of weekly manual entry.
    excludes: "One-time import (→ bulk-import)."
    draft_tally: 15
    status: active
    examples:
      - "Small nonprofit on trial asks how to integrate 90 with Zoom and Monday and track donor metrics beyond manual entry."
      - "New owner likes the lightweight fit; asks about API data import and mobile before piloting next meeting."
      - "Multi-company owner fighting login issues asks whether scorecard metrics can auto-populate instead of manual entry; cost-conscious."

  - id: public-api
    name: "Public API completeness"
    area: integrations
    kind: integration
    definition: >-
      API coverage, rate limits, modern auth, and objects exposed via API.
    excludes: "Tier gating of the API (→ feature-tier-gating)."
    draft_tally: 8
    status: active
    examples:
      - "MSP asks whether Ninety has an API to consolidate a client's seven-to-eight services into one dashboard; confirmed it needs Thrive tier."
      - "'The API is an outdated style' using a bearer token and MCP needs Zapier — can't integrate 90 with Claude or mainstream tools."
      - "VP's personal API token is hitting query limits; wants an upgraded tier plus SVEP and accountability-chart data exposed via API."

  - id: third-party-tools
    name: "Other named tool integrations"
    area: integrations
    kind: integration
    definition: >-
      Asana, Monday, Zapier, HRIS, Salesforce, Power BI, Odoo, 15Five, Planning Center, Zoom and similar.
    draft_tally: 15
    status: active
    examples:
      - "Weighing 90 against EOS One; wants an Asana integration and to know 'what can't I do in 90 that I could in eosone.'"
      - "Small nonprofit on trial asks how to integrate 90 with Zoom and Monday and track donor metrics beyond manual entry."
      - "Ready to subscribe but trial is expiring and he lacks owner rights; still wants Asana integrated with his scorecard."

  - id: scorecard-rollups
    name: "Scorecard roll-ups and totals"
    area: scorecard
    kind: gap
    definition: >-
      Aggregate measurables across teams, locations and periods (weekly→monthly→annual, group and parent totals).
    excludes: "Calculation bugs (→ scorecard-calc-defects)."
    draft_tally: 8
    status: active
    examples:
      - "Switched from Bloom for stability but misses Scorecard auto number roll-up and admin visibility into all department meeting minutes."
      - "Building a roll-up scorecard metric across four regions; notes a measurable's owner can't be changed once assigned."
      - "Evaluating against Strety; wants scorecard formulas from sum-total columns, date-range rock tracking, and documentation linked to seats."

  - id: scorecard-calc-defects
    name: "Scorecard calculation defects"
    area: scorecard
    kind: defect
    definition: >-
      Totals stop calculating, values replicate across scorecards, measurables duplicate or vanish.
    draft_tally: 4
    status: active
    examples:
      - "Managers couldn't add issues on iPads so he dropped their licenses; group scorecard won't total all-time data."
      - "Site 'does not interact with Safari,' forcing Firefox; measurables duplicate and vanish; can't share VTO/Scorecard across teams."
      - "Entering a number in one store's scorecard 'populates the same number on the other' seven scorecards."

  - id: scorecard-flexibility
    name: "Scorecard flexibility"
    area: scorecard
    kind: gap
    definition: >-
      Non-numeric metrics, formulas, budget vs actual, currencies, per-team vs per-person, unit/owner edits, week start, one scorecard across teams.
    draft_tally: 13
    status: active
    examples:
      - "New team can't see weekly scorecard KPIs a colleague entered; wants structure around eos."
      - "Building a roll-up scorecard metric across four regions; notes a measurable's owner can't be changed once assigned."
      - "Switching from Rhythm to Ninety; asks about team visibility, locked measurable units, and automating data import/export."

  - id: todo-project-management
    name: "To-dos as lightweight project management"
    area: execution
    kind: gap
    definition: >-
      Subtasks, multiple assignees, team-level to-dos, recurring to-dos, project tracking beyond meetings.
    draft_tally: 7
    status: active
    examples:
      - "Wants twelve licenses to track strategic/quarterly projects and accountability so daily ops don't bury them."
      - "Wants To-Dos to work like project management—subtasks and multiple assignees—and questions whether it's robust enough."
      - "EOS-new team wants robust project-management tracking (hiring-funnel status) beyond meetings, plus pricing and implementation help."

  - id: issue-workflow
    name: "Issue carry-over and organization"
    area: execution
    kind: gap
    definition: >-
      Carry issues between meetings/teams, reopen, bulk archive, group under a project, delete behavior.
    draft_tally: 10
    status: active
    examples:
      - "Construction owner asks whether multi-team membership means paying per seat, and how to bulk-archive headlines; left 'a lot better.'"
      - "Asks whether every division user needs a paid license and how an issue closes once its to-do is completed."
      - "Underperforming manufacturer asks how open meeting topics carry forward and how to convert a free account to paid."

  - id: rock-templates
    name: "Rock templates and quarterly carry-over"
    area: execution
    kind: gap
    definition: >-
      Reuse rock structures each quarter rather than re-entering; carry goals forward.
    draft_tally: 3
    status: active
    examples:
      - "Brand-new admin, barely knows the system, unsure whether to enter nearly-finished rocks now or wait for next quarter's set."
      - "First-time integrator wants to bulk-upload ~50 issues from Excel and asks how to carry over prior-year 2026 goals."
      - "Quarterly rock setup forces redundant manual re-entry per broker — wants templates to avoid rebuilding each quarter."

  - id: custom-meetings
    name: "Custom meeting types and sections"
    area: meetings
    kind: gap
    definition: >-
      Custom meeting templates, editable sections, non-L10 formats (coaching sessions, two-month quarters).
    draft_tally: 5
    status: active
    examples:
      - "Return trialist wants 'enter once, appear everywhere' integrations and support for coaching sessions distinct from L10s."
      - "Wants a custom-meeting template library and a real 1:1 hub, and to trial a higher tier without losing Legacy; Maz can't build custom meetings."
      - "Wants an editable custom meeting section for events he can add and update live; Fin AI 'not helpful at all,' conversation abandoned."

  - id: meeting-notifications
    name: "Meeting reminders and recaps"
    area: meetings
    kind: gap
    definition: >-
      Pre-meeting reminders, recaps to absent members/leadership, digest readability, facilitator notifications.
    draft_tally: 8
    status: active
    examples:
      - "Prospect on Bloom Growth wants the differentiation case, an L10 prep reminder, and help migrating data off Bloom Growth."
      - "Returning user setting up ~6 seats to run L10s; asks about automated to-do reminders and scorecard views."
      - "New owner loaded scorecard and rocks but doesn't know how to assign items or push meeting reminders to the team."

  - id: cross-team-dashboards
    name: "Cross-team dashboards and reporting"
    area: reporting
    kind: gap
    definition: >-
      Owner/exec view across teams and meetings, KPI dashboards, analytics, aggregated 'my work'.
    draft_tally: 12
    status: active
    examples:
      - "Construction owner asks whether multi-team membership means paying per seat, and how to bulk-archive headlines; left 'a lot better.'"
      - "Wants 90's scorecard to centralize project dashboards for the CPO to present to senior leadership by mid-August."
      - "On Bloom under a district office; weighing own subscription, asking how parent-office L10 visibility and private to-dos work."

  - id: meeting-summary-accuracy
    name: "Meeting summary accuracy"
    area: reporting
    kind: defect
    definition: >-
      Summaries or AI reports showing wrong counts (e.g., zero rocks/issues) or disagreeing with Insights.
    draft_tally: 2
    status: active
    examples:
      - "No Teams integration; AI summaries don't match Insights data"
      - "Quarterly summaries show zero rocks created and issues solved"

  - id: multi-company-accounts
    name: "Multiple companies under one login"
    area: org
    kind: gap
    definition: >-
      Run several businesses: one login across companies, separate accounts per entity, sharing licenses, toggling.
    draft_tally: 10
    status: active
    examples:
      - "EA wants multiple owned companies under one login and to draft the org chart before publishing to everyone."
      - "Consultant wants a separate account he pays for, single-login toggling, and a free data upload before next week's L10."
      - "Runs two businesses on one account via separate teams; asks for a smarter structure and habit-forming adoption tips."

  - id: roles-and-team-setup
    name: "Roles and team setup"
    area: org
    kind: confusion
    definition: >-
      Admin/manager/managee/observer role confusion, scoped roles, can't create teams, parent/child teams, scribe role.
    excludes: "Paid-seat questions (→ seat-model-confusion)."
    draft_tally: 14
    status: active
    examples:
      - "Admin confused by parent/child team structure; a client wants teams combined so both members gain cross-company access."
      - "Team confused about setup ownership and admin-versus-manager rights; a colleague couldn't add teammates."
      - "Wants a scoped project-team 'manager' role that manages a team without gaining manager access elsewhere or creating paid seats."

  - id: visibility-controls
    name: "Granular visibility and privacy"
    area: org
    kind: gap
    definition: >-
      Private to-dos/teams, restrict documents, per-member or per-measurable visibility, scoped send-to.
    draft_tally: 11
    status: active
    examples:
      - "Cut licenses after a reorg and moved performance-review data out of 90 as integration features kept slipping; wants last-login visibility and granular permissions."
      - "Early EOS self-implementer exploring 90 for the leadership team; asks whether access to onboarding documents can be restricted."
      - "On Bloom under a district office; weighing own subscription, asking how parent-office L10 visibility and private to-dos work."

  - id: accountability-chart-scale
    name: "Accountability chart at scale"
    area: org
    kind: gap
    definition: >-
      Upload a chart, segment/print large charts, multiple charts, drafts, moving seats, job descriptions.
    draft_tally: 8
    status: active
    examples:
      - "EA wants multiple owned companies under one login and to draft the org chart before publishing to everyone."
      - "Chick-fil-A operator eos-curious, planning a Q4 soft launch; anticipates accountability-chart friction over tenure."
      - "Executive assistant asks how SVPs set as managers create per-business-line accountability charts/VTOs, and why a managee can't see the draft chart."

  - id: reviews-and-one-on-ones
    name: "1:1s and performance reviews"
    area: people
    kind: gap
    definition: >-
      Formal 1:1 hub, custom review sections and cadence, centralized review history, completion export.
    excludes: "Tier gating (→ feature-tier-gating)."
    draft_tally: 13
    status: active
    examples:
      - "On a grandfathered plan; wants one-on-one and annual review features but some seats can't access them — which plan?"
      - "Exploring Ninety to consolidate scattered L10s and scorecards, curious about performance-review scoring, packages, and starting a free trial."
      - "Wants one platform to replace EOS One and Threads for reviews, org chart, and SOPs; asked fee difference and upload charges."

  - id: login-invite-failures
    name: "Login and invite failures"
    area: auth
    kind: defect
    definition: >-
      Can't log in, invite or password-reset emails not arriving, verification loops, 'not an active user' errors.
    draft_tally: 17
    status: active
    examples:
      - "A Gmail user isn't receiving invitations — likely spam; otherwise praises Ninety's pricing versus traction tools."
      - "Returning user struggled setting up roles and couldn't get team invite emails to send during onboarding."
      - "New team hitting setup snags—observer versus paid seat for to-do assignment, duplicate entries, and unaccepted invites."

  - id: sso-enforcement
    name: "Enterprise SSO and provisioning"
    area: auth
    kind: gap
    definition: >-
      Org-level SSO enforcement (Entra, Okta, Google), block password logins, SCIM provisioning.
    draft_tally: 7
    status: active
    examples:
      - "Can't enforce SSO or disable a user's login via Microsoft Entra; MFA is phone-only — calls it a big enterprise security gap."
      - "Wants an admin-controlled org-level setting to enforce Microsoft 365 SSO and block password logins entirely."
      - "Wants org-wide SSO-only login to block password logins, preferably via Okta, with Google SSO acceptable."

  - id: mfa-international
    name: "MFA options and international numbers"
    area: auth
    kind: gap
    definition: >-
      MFA beyond phone; international numbers fail; authenticator app support.
    draft_tally: 5
    status: active
    examples:
      - "Wants to assign to-dos to non-computer staff (a driver) and asks about two-factor authentication and data security."
      - "Can't enforce SSO or disable a user's login via Microsoft Entra; MFA is phone-only — calls it a big enterprise security gap."
      - "Auth code 'never actually prompts for me to input it' on every login — flagged as an FYI."

  - id: account-email-management
    name: "Account and email changes"
    area: auth
    kind: gap
    definition: >-
      Changing login email, domain migrations, duplicate or mis-registered accounts, splitting shared logins.
    draft_tally: 8
    status: active
    examples:
      - "Non-technical new buyer setting up; must split a shared company email into individual logins before rolling out."
      - "Switching a client off Bloom Growth for cheaper per-seat price; needs a second user despite reusing one email."
      - "Scrambling to set up before a same-day first L10; blocked by a duplicate account carrying another company's logo."

  - id: mobile-scorecard
    name: "Scorecard on mobile"
    area: mobile
    kind: gap
    definition: >-
      View and enter scorecard numbers in the mobile app.
    draft_tally: 6
    status: active
    examples:
      - "Partner relays setup help and wonders whether mobile can show aggregate measurables across teams without toggling."
      - "CIO asks about mobile Scorecard visibility, SSO, SOC 2 compliance, hosting, and PDF/Excel export."
      - "'The IOS app needs to be updated to allow for viewing/inputting # into the metrics/scorecard' — asks why it's missing."

  - id: mobile-parity
    name: "Mobile feature parity"
    area: mobile
    kind: gap
